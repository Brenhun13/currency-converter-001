<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Currency Converter</title>

    <meta name="description"
        content="Free live currency converter with real-time exchange rates.">

    <!-- Google AdSense -->
    <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8398911924029778"
        crossorigin="anonymous">
    </script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="page">

        <!-- LEFT AD -->
        <aside class="ad-sidebar left-ad">

            <ins class="adsbygoogle"
                style="display:block"
                data-ad-client="ca-pub-8398911924029778"
                data-ad-slot="YOUR_SLOT_ID"
                data-ad-format="auto">
            </ins>

            <script>
                (adsbygoogle = window.adsbygoogle || []).push({});
            </script>

        </aside>

        <!-- MAIN CONTENT -->
        <main class="converter-container">

            <h1>Live Currency Converter</h1>

            <div class="converter-card">

                <input
                    type="number"
                    id="amount"
                    value="100"
                    min="0">

                <div class="currency-row">

                    <select id="fromCurrency"></select>

                    <button id="swapBtn">
                        ⇄
                    </button>

                    <select id="toCurrency"></select>

                </div>

                <button id="convertBtn">
                    Convert
                </button>

                <div id="result">
                    Loading...
                </div>

                <div id="rateInfo"></div>

            </div>

            <!-- BOTTOM AD -->

            <div class="bottom-ad">

                <ins class="adsbygoogle"
                    style="display:block"
                    data-ad-client="ca-pub-8398911924029778"
                    data-ad-slot="YOUR_SLOT_ID"
                    data-ad-format="auto"
                    data-full-width-responsive="true">
                </ins>

                <script>
                    (adsbygoogle = window.adsbygoogle || []).push({});
                </script>

            </div>

        </main>

        <!-- RIGHT AD -->

        <aside class="ad-sidebar right-ad">

            <ins class="adsbygoogle"
                style="display:block"
                data-ad-client="ca-pub-8398911924029778"
                data-ad-slot="YOUR_SLOT_ID"
                data-ad-format="auto">
            </ins>

            <script>
                (adsbygoogle = window.adsbygoogle || []).push({});
            </script>

        </aside>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
